<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waitstaff Portal – Select Table</title>  <style>
    :root {
      --bg-dark: #1B1F23;
      --card-bg: #262B30;
      --warm-orange: #FF7A45;
      --warm-orange-hover: #E86835;
      --soft-blue: #4C9AFF;
      --success-green: #4CAF50;
      --warning-amber: #F5A623;
      --danger-red: #E63946;
      --off-white: #FAFAFA;
      --text-muted: #9CA3AF;
      --border-dark: #2E343A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--off-white);
      height: 100vh;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Dimmed background (simulating previous page behind modal) */
    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    /* Sidebar (dimmed) */
    .sidebar {
      width: 220px;
      background: #16191D;
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      flex-shrink: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--off-white);
    }

    .logo .status {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 28px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    .nav-item.active {
      background: rgba(255, 122, 69, 0.15);
      color: var(--warm-orange);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
    }

    /* Modal */
    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      z-index: 20;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .modal-header {
      padding: 24px 28px 16px;
      position: relative;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--off-white);
      margin-bottom: 4px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .close-btn:hover {
      background: var(--border-dark);
      color: var(--off-white);
    }

    .close-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Search + Legend */
    .modal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 20px;
      gap: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 9px 14px;
      flex: 1;
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--off-white);
      font-size: 13px;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot.occupied { background: var(--danger-red); }
    .dot.selected { background: var(--warm-orange); }
    .dot.available { background: var(--success-green); }

    /* Tables Grid */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      padding: 0 28px 24px;
    }

    .table-btn {
      aspect-ratio: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--off-white);
      font-weight: 600;
      font-size: 15px;
      position: relative;
    }

    .table-btn:hover:not(.occupied) {
      border-color: var(--warm-orange);
      background: #2D333A;
    }

    .table-btn.available {
      border-color: var(--border-dark);
    }

    .table-btn.occupied {
      opacity: 0.45;
      cursor: not-allowed;
      color: var(--text-muted);
    }

    .table-btn.selected {
      background: rgba(255, 122, 69, 0.15);
      border-color: var(--warm-orange);
      color: var(--warm-orange);
    }

    .table-btn .seats {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .table-btn.selected .seats {
      color: var(--warm-orange);
    }

    .table-btn .seats svg {
      width: 10px;
      height: 10px;
    }

    /* Footer */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-top: 1px solid var(--border-dark);
      background: #16191D;
    }

    .selection-info {
      font-size: 13px;
    }

    .selection-label {
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .selection-value {
      font-weight: 600;
      color: var(--warm-orange);
    }

    .selection-value.empty {
      color: var(--text-muted);
      font-weight: 500;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
    }

    .btn-cancel:hover {
      background: var(--card-bg);
      color: var(--off-white);
    }

    .btn-continue {
      background: var(--warm-orange);
      color: white;
    }

    .btn-continue:hover {
      background: var(--warm-orange-hover);
    }

    .btn-continue:disabled {
      background: var(--border-dark);
      color: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let selectedTableNumber = null;

      const continueBtn = document.querySelector('.btn-continue');
      const cancelBtn = document.querySelector('.btn-cancel');
      const closeBtn = document.querySelector('.close-btn');
      const selectionValue = document.querySelector('.selection-value');
      const searchInput = document.querySelector('.search-box input');

      if (closeBtn) closeBtn.addEventListener('click', () => window.location.href = 'orders.html');
      if (cancelBtn) cancelBtn.addEventListener('click', () => window.location.href = 'orders.html');

      async function renderSelectGrid() {
        const data = await API.fetchTables();
        if (!data || !data.tables) return;

        const grid = document.querySelector('.tables-grid');
        if (!grid) return;

        grid.innerHTML = '';
        data.tables.forEach(t => {
          const btn = document.createElement('button');
          const isOccupied = t.status === 'occupied';
          btn.className = `table-btn ${isOccupied ? 'occupied' : 'available'}`;
          
          btn.innerHTML = `
            ${t.table_number}
            <span class="seats">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              ${t.capacity}
            </span>
          `;

          if (!isOccupied) {
            btn.addEventListener('click', () => {
              document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
              selectedTableNumber = t.table_number;

              if (selectionValue) {
                selectionValue.textContent = `Table ${t.table_number} (${t.capacity} Guests)`;
                selectionValue.classList.remove('empty');
              }
              if (continueBtn) {
                continueBtn.disabled = false;
              }
            });
          }

          grid.appendChild(btn);
        });
      }

      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          if (selectedTableNumber) {
            window.location.href = `neworder.html?tableId=${selectedTableNumber}`;
          }
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.trim();
          const btns = document.querySelectorAll('.table-btn');
          btns.forEach(btn => {
            const num = btn.childNodes[0].textContent.trim();
            if (!query || num === query) {
              btn.style.display = 'flex';
            } else {
              btn.style.display = 'none';
            }
          });
        });
      }

      renderSelectGrid();
    });
  </script>
